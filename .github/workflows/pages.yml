name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - 'favicon.svg'
      - 'icons.svg'
      - 'api/wakatime.json'
      - '.nojekyll'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh WakaTime snapshot
        run: npm run refresh:wakatime
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      - name: Build site
        run: npm run build
      - name: Publish built files at repository root
        run: |
          node scripts/publish-pages-root.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nojekyll index.html assets favicon.svg icons.svg api/wakatime.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish built portfolio files'
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
